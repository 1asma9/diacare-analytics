<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}DiaCare Discharge{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><i></i>DiaCare Discharge</a>
    <nav>
      <a href="/"       class="{{ 'on' if active=='form'  }}">Patient</a>
      <a href="/batch"  class="{{ 'on' if active=='batch' }}">Batch</a>
      <a href="/model"  class="{{ 'on' if active=='model' }}">About the model</a>
    </nav>
  </div>
</header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
<footer>Discharge destination screening tool — academic project (ESPRIT, 4CCE19). Not a clinical device, not a medical decision.</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
